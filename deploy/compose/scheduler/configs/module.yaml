service_name: scheduler
trust_domain: '@@TRUST_DOMAIN@@'
env: '@@MESH_ENV@@'
identity:
  provider: provided
mesh_enroll:
  enabled: true
  enroll_url: '@@LCM_ENROLL_URL@@'
  lcm_grpc: '@@LCM_GRPC@@'
  tenant_id: '@@TENANT_ID@@'
  token_file: /tokens/enrollment.token
  state_file: /state/svid.json
  insecure: false
  ca_file: /certs/ca.pem
  server_spiffe_id: spiffe://@@TRUST_DOMAIN@@/svc/lcm
authz:
  source: file
  path: /policies/scheduler.yaml
server:
  grpc_addr: 0.0.0.0:9905
  http_addr: 0.0.0.0:9906
admin:
  addr: 127.0.0.1:9800
discovery:
  static:
    gateway:
    - '@@GATEWAY_GRPC@@'
    auth:
    - '@@AUTH_GRPC@@'
    lcm:
    - '@@LCM_GRPC@@'
    ipam:
    - ipam:9985
    notification:
    - notification:9943
    signing:
    - signing:9915
    hr:
    - hr:9925
    asset:
    - asset:9995
limits:
  max_request_bytes: 33620992
db:
  dsn: postgres://scheduler_app:dev@local-scheduler-timescaledb:5432/scheduler?sslmode=disable
  migrate_dsn: postgres://postgres:dev@local-scheduler-timescaledb:5432/scheduler?sslmode=disable
  max_conns: 16
valkey:
  addresses:
  - local-scheduler-valkey:6379
  username: scheduler
  password: dev
  allow_plaintext: true
events:
  enabled: true
platform_tenant_id: 00000000-0000-0000-0000-000000000001
engine:
  tick_ms: 1000
  workers: 16
  batch: 100
  misfire_grace_seconds: 60
  lease_grace_seconds: 30
  retention_days: 90
  retention_interval_minutes: 60
  instance_id: ''
limits_scheduler:
  max_payload_bytes: 65536
  max_result_bytes: 65536
  max_timeout_seconds: 3600
  min_interval_seconds: 60
  max_page_size: 200
  max_backup_bytes: 33554432
  max_tasks_per_tenant: 1000
gateway:
  service: gateway
  issuer: '@@GATEWAY_ISSUER@@'
