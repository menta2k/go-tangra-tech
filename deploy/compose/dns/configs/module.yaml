service_name: dns
trust_domain: '@@TRUST_DOMAIN@@'
env: '@@MESH_ENV@@'
identity:
  provider: provided
mesh_enroll:
  enabled: true
  enroll_url: '@@LCM_ENROLL_URL@@'
  lcm_grpc: '@@LCM_GRPC@@'
  tenant_id: '@@TENANT_ID@@'
  token_file: /tokens/enrollment.token
  state_file: /state/svid.json
  insecure: false
  ca_file: /certs/ca.pem
  server_spiffe_id: spiffe://@@TRUST_DOMAIN@@/svc/lcm
authz:
  source: file
  path: /policies/dns.yaml
server:
  grpc_addr: 0.0.0.0:9965
  http_addr: 0.0.0.0:9966
admin:
  addr: 127.0.0.1:9850
discovery:
  static:
    gateway:
    - '@@GATEWAY_GRPC@@'
    auth:
    - '@@AUTH_GRPC@@'
    lcm:
    - '@@LCM_GRPC@@'
    ipam:
    - ipam:9985
    warden:
    - warden:9843
limits:
  max_request_bytes: 67174400
limits_dns:
  max_request_bytes: 1048576
  max_backup_bytes: 67108864
  max_export_bytes: 33554432
  max_page_size: 100
db:
  dsn: postgres://dns_app:dev@local-dns-timescaledb:5432/dns?sslmode=disable
  migrate_dsn: postgres://postgres:dev@local-dns-timescaledb:5432/dns?sslmode=disable
valkey:
  addresses:
  - local-dns-valkey:6379
  username: dns
  password: dev
  allow_plaintext: true
kek:
  source: file
  path: /keys/kek
pdns:
  api_url: http://local-dns-pdns-auth:8081
  server_id: localhost
  api_key_ref: file:/secrets/pdns-auth.key
  allow_plaintext: true
  auth_forward_host: pdns-auth
  auth_forward_port: 53
recursor:
  api_url: http://local-dns-pdns-recursor:8082
  server_id: localhost
  api_key_ref: file:/secrets/pdns-recursor.key
  allow_plaintext: true
  reconcile_interval_seconds: 60
docker:
  enabled: false
  socket: /var/run/docker.sock
  auth_container: freya-pdns-auth
  recursor_container: freya-pdns-recursor
managed_files:
  auth_path: /pdns-auth-conf/50-freya.conf
  recursor_path: /pdns-recursor-conf/50-freya.yml
metrics:
  prometheus_url: http://prometheus:9090
ipam_sync:
  enabled: true
  tenants:
  - 00000000-0000-0000-0000-000000000001
  service: ipam
acme:
  allowed_caller: spiffe://example.org/svc/lcm
secrets:
  warden_service: warden
  refresh_seconds: 300
events:
  enabled: true
gateway:
  service: gateway
  issuer: '@@GATEWAY_ISSUER@@'
