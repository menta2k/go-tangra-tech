service_name: inventory
trust_domain: '@@TRUST_DOMAIN@@'
env: '@@MESH_ENV@@'
identity:
  provider: provided
mesh_enroll:
  enabled: true
  enroll_url: https://lcm:9947/api/lcm/v1/enroll
  lcm_grpc: lcm:9945
  tenant_id: 00000000-0000-0000-0000-000000000001
  token_file: /tokens/inventory.token
  state_file: /state/svid.json
  insecure: false
  ca_file: /certs/ca.pem
  server_spiffe_id: spiffe://example.org/svc/lcm
authz:
  source: file
  path: /policies/inventory.yaml
server:
  grpc_addr: 0.0.0.0:9975
  http_addr: 0.0.0.0:9976
admin:
  addr: 127.0.0.1:9810
discovery:
  static:
    gateway:
    - '@@GATEWAY_GRPC@@'
    auth:
    - '@@AUTH_GRPC@@'
    lcm:
    - '@@LCM_GRPC@@'
limits:
  max_request_bytes: 16842752
limits_inventory:
  max_request_bytes: 16842752
  max_snapshot_bytes: 16777216
db:
  dsn: postgres://inventory_app:dev@local-inventory-timescaledb:5432/inventory?sslmode=disable
  migrate_dsn: postgres://postgres:dev@local-inventory-timescaledb:5432/inventory?sslmode=disable
valkey:
  addresses:
  - local-inventory-valkey:6379
  username: inventory
  password: dev
  allow_plaintext: true
kek:
  source: file
  path: /keys/kek
ingest:
  addr: 0.0.0.0:9977
  insecure: true
registry:
  heartbeat_seconds: 30
retention:
  days: 90
stale:
  after_seconds: 86400
jobs:
  workers: 4
  interval_seconds: 60
  purge_interval_seconds: 3600
events:
  enabled: true
gateway:
  service: gateway
  issuer: '@@GATEWAY_ISSUER@@'
enroll:
  token_ttl_seconds: 3600
  enabled: true
  tenant_id: '@@TENANT_ID@@'
  token_file: /tokens/enrollment.token
  enroll_url: '@@LCM_ENROLL_URL@@'
  lcm_grpc: '@@LCM_GRPC@@'
  ca_file: /certs/ca.pem
  server_spiffe_id: spiffe://@@TRUST_DOMAIN@@/svc/lcm
  insecure: false
