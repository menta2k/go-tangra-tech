service_name: sms-gw
trust_domain: '@@TRUST_DOMAIN@@'
env: '@@MESH_ENV@@'
identity:
  provider: provided
authz:
  source: file
  path: /policies/sms-gw.yaml
server:
  grpc_addr: 0.0.0.0:9983
  http_addr: 0.0.0.0:9984
admin:
  addr: 127.0.0.1:9593
discovery:
  static:
    gateway:
    - '@@GATEWAY_GRPC@@'
    auth:
    - '@@AUTH_GRPC@@'
    lcm:
    - '@@LCM_GRPC@@'
db:
  dsn: postgres://smsgw_app:dev@local-sms-gw-timescaledb:5432/sms_gw?sslmode=disable
  migrate_dsn: postgres://postgres:dev@local-sms-gw-timescaledb:5432/sms_gw?sslmode=disable
  max_conns: 16
kek:
  source: file
  path: /secrets/kek
gateway:
  service: gateway
  issuer: '@@GATEWAY_ISSUER@@'
  auth_service: auth
enroll:
  enabled: true
  tenant_id: '@@TENANT_ID@@'
  token_file: /tokens/enrollment.token
  state_file: /state/svid.json
  lcm_grpc: '@@LCM_GRPC@@'
  enroll_url: '@@LCM_ENROLL_URL@@'
  insecure: false
  ca_file: /certs/ca.pem
  server_spiffe_id: spiffe://@@TRUST_DOMAIN@@/svc/lcm
public:
  http_addr: 0.0.0.0:9901
  https_addr: ''
  trusted_proxies: []
  max_body_bytes: 65536
public_auth:
  jwt_secret:
    file: /secrets/jwt.key
  access_ttl_seconds: 7200
  refresh_ttl_seconds: 604800
acme:
  enabled: false
  cache_dir: /acme
webhook:
  allow_http: true
  allow_private: true
  queue_size: 4096
  workers: 4
retention:
  interval: 1h
monitoring:
  prometheus_url: ''
query:
  default_page_size: 50
  max_page_size: 500
