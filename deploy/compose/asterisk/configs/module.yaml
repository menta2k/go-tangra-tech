service_name: asterisk
trust_domain: '@@TRUST_DOMAIN@@'
env: '@@MESH_ENV@@'
identity:
  provider: provided
mesh_enroll:
  enabled: true
  tenant_id: '@@TENANT_ID@@'
  token_file: /tokens/enrollment.token
  state_file: /state/svid.json
  lcm_grpc: '@@LCM_GRPC@@'
  enroll_url: '@@LCM_ENROLL_URL@@'
  insecure: false
  ca_file: /certs/ca.pem
  server_spiffe_id: spiffe://@@TRUST_DOMAIN@@/svc/lcm
authz:
  source: file
  path: /policies/asterisk.yaml
server:
  http_addr: 0.0.0.0:9982
  grpc_addr: 0.0.0.0:9981
admin:
  addr: 127.0.0.1:9094
discovery:
  static:
    auth:
    - '@@AUTH_GRPC@@'
    gateway:
    - '@@GATEWAY_GRPC@@'
    lcm:
    - '@@LCM_GRPC@@'
binding:
  tenant_id: 00000000-0000-0000-0000-000000000001
  pbx_id: 00000000-0000-0000-0000-000000000002
  cdr_dsn: ${ASTERISK_CDR_DSN}
  config_dsn: ''
  registration_dsn: asterisk_app:registration-dev-only@tcp(local-asterisk-registration-db:3306)/asterisk_registration?parseTime=true
  registration_retention_days: 400
  recording_root: ''
  timezone: Europe/Sofia
  source_timezone: Europe/Sofia
  monitoring_url: ''
  monitoring_dedicated: true
ami:
  enabled: false
gateway:
  service: gateway
  issuer: '@@GATEWAY_ISSUER@@'
query_timeout_seconds: 5
stream_seconds: 240
