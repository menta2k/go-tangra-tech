# Module enrollment into an existing core; no new Auth, Portal or LCM.
name: tangra-warden
services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: postgres
    volumes:
    - ./init-db.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    - database-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD
      - pg_isready
      - -U
      - postgres
      - -h
      - 127.0.0.1
      - -p
      - '5432'
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 5s
    restart: unless-stopped
    depends_on: {}
    networks:
      default:
        aliases:
        - local-warden-timescaledb
  valkey:
    image: valkey/valkey:8
    command:
    - valkey-server
    - --requirepass
    - dev
    - --user
    - gateway
    - 'on'
    - '>dev'
    - ~*
    - '&*'
    - +@all
    - --user
    - auth
    - 'on'
    - '>dev'
    - ~*
    - '&*'
    - +@all
    - --user
    - lcm
    - 'on'
    - '>dev'
    - ~*
    - '&*'
    - +@all
    - --user
    - notification
    - 'on'
    - '>dev'
    - ~*
    - '&*'
    - +@all
    - --user
    - warden
    - 'on'
    - '>dev'
    - ~*
    - '&*'
    - +@all
    - --user
    - deployer
    - 'on'
    - '>dev'
    - ~*
    - '&*'
    - +@all
    - --user
    - paperless
    - 'on'
    - '>dev'
    - ~*
    - '&*'
    - +@all
    - --user
    - inventory
    - 'on'
    - '>dev'
    - ~*
    - '&*'
    - +@all
    - --user
    - ipam
    - 'on'
    - '>dev'
    - ~*
    - '&*'
    - +@all
    - --user
    - asset
    - 'on'
    - '>dev'
    - ~*
    - '&*'
    - +@all
    - --user
    - ticket
    - 'on'
    - '>dev'
    - ~*
    - '&*'
    - +@all
    - --user
    - dns
    - 'on'
    - '>dev'
    - ~*
    - '&*'
    - +@all
    - --user
    - signing
    - 'on'
    - '>dev'
    - ~*
    - '&*'
    - +@all
    - --user
    - hr
    - 'on'
    - '>dev'
    - ~*
    - '&*'
    - +@all
    - --appendonly
    - 'yes'
    healthcheck:
      test:
      - CMD
      - valkey-cli
      - -a
      - dev
      - ping
      interval: 3s
      timeout: 3s
      retries: 40
    volumes:
    - valkey-data:/data
    restart: unless-stopped
    depends_on: {}
    networks:
      default:
        aliases:
        - local-warden-valkey
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    depends_on: {}
    volumes: []
    networks:
      default:
        aliases:
        - local-warden-mailpit
  vault:
    image: hashicorp/vault:1.18
    user: 0:0
    entrypoint:
    - sh
    - /vault-start.sh
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    volumes:
    - vault-data:/vault/file
    - vault-bootstrap:/vault-bootstrap
    - ./vault/config.hcl:/etc/vault/config.hcl:ro
    - ./vault/start.sh:/vault-start.sh:ro
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - vault
      - status
      interval: 3s
      timeout: 3s
      retries: 60
    depends_on: {}
    networks:
      default:
        aliases:
        - local-warden-vault
  vault-init:
    image: hashicorp/vault:1.18
    user: 0:0
    entrypoint:
    - sh
    - /vault-init.sh
    environment:
      VAULT_ADDR: http://vault:8200
      OUT: /vault-creds
    volumes:
    - vault-bootstrap:/vault-bootstrap:ro
    - vault-creds:/vault-creds
    - ./vault/init.sh:/vault-init.sh:ro
    - ./vault/approle.sh:/vault-approle.sh:ro
    restart: 'no'
    depends_on:
      vault:
        condition: service_healthy
    networks:
    - default
  warden:
    image: ghcr.io/go-tangra/go-tangra-warden:${WARDEN_VERSION:-4.5.3}
    user: 0:0
    command:
    - -config
    - deploy/container.yaml
    volumes:
    - ${ENROLLMENT_TOKEN_FILE:-./private/enrollment.token}:/tokens/enrollment.token:ro
    - warden-state:/state
    - vault-creds:/vault-creds:ro
    - ./runtime/config.yaml:/app/deploy/container.yaml:ro
    - ./runtime/policy.yaml:/policies/warden.yaml:ro
    - ${MESH_CA_FILE:-./private/ca.pem}:/certs/ca.pem:ro
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://127.0.0.1:9490/readyz
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    depends_on:
      timescaledb:
        condition: service_healthy
      valkey:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      default:
        aliases:
        - warden
    environment:
      FREYA_ADVERTISE_HOST: ${MODULE_ADVERTISE_HOST:?Set a module host reachable from the core}
    ports:
    - ${MODULE_BIND_IP:?Set the private module host bind IP}:9843:9843
    - ${MODULE_BIND_IP:?Set the private module host bind IP}:9844:9844
  check:
    image: alpine:3.20
    profiles:
    - checks
    network_mode: service:warden
    entrypoint:
    - sh
    - -ec
    command:
    - for i in $$(seq 1 60); do if wget -qO- http://127.0.0.1:9490/healthz && wget -qO- http://127.0.0.1:9490/readyz; then echo; echo "Health and readiness passed"; exit 0; fi; sleep 2; done; exit 1
    depends_on:
      warden:
        condition: service_started
    restart: 'no'
    volumes: []
volumes:
  database-data: {}
  valkey-data: {}
  vault-data: {}
  vault-bootstrap: {}
  vault-creds: {}
  warden-state: {}
networks:
  default: {}
