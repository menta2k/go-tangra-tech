service_name: signing
trust_domain: '@@TRUST_DOMAIN@@'
env: '@@MESH_ENV@@'
identity:
  provider: provided
mesh_enroll:
  enabled: true
  enroll_url: '@@LCM_ENROLL_URL@@'
  lcm_grpc: '@@LCM_GRPC@@'
  tenant_id: '@@TENANT_ID@@'
  token_file: /tokens/enrollment.token
  state_file: /state/svid.json
  insecure: false
  ca_file: /certs/ca.pem
  server_spiffe_id: spiffe://@@TRUST_DOMAIN@@/svc/lcm
authz:
  source: file
  path: /policies/signing.yaml
server:
  grpc_addr: 0.0.0.0:9915
  http_addr: 0.0.0.0:9916
admin:
  addr: 127.0.0.1:9860
discovery:
  static:
    gateway:
    - '@@GATEWAY_GRPC@@'
    auth:
    - '@@AUTH_GRPC@@'
    notification:
    - notification:9943
    warden:
    - warden:9843
    scheduler:
    - scheduler:9905
    lcm:
    - '@@LCM_GRPC@@'
limits:
  max_request_bytes: 67108864
db:
  dsn: postgres://signing_app:dev@local-signing-timescaledb:5432/signing?sslmode=disable
  migrate_dsn: postgres://postgres:dev@local-signing-timescaledb:5432/signing?sslmode=disable
  max_conns: 16
valkey:
  addresses:
  - local-signing-valkey:6379
  username: signing
  password: dev
  allow_plaintext: true
events:
  enabled: true
platform_tenant_id: 00000000-0000-0000-0000-000000000001
kek:
  source: file
  path: /keys/kek
object_store:
  endpoint: local-signing-rustfs:9000
  bucket: signing
  region: us-east-1
  use_ssl: false
  access_key: paperless
  secret_key: paperless-dev-secret
auth:
  service: auth
notification:
  service: notification
warden:
  service: warden
task_scheduler:
  enabled: true
  service: scheduler
links:
  portal_base_url: '@@GATEWAY_ISSUER@@'
limits_signing:
  max_pdf_bytes: 52428800
  max_pdf_pages: 500
  max_fields: 500
  max_signers: 50
  max_image_bytes: 1048576
  max_field_upload_bytes: 5242880
  parse_timeout_seconds: 20
  max_page_size: 100
  max_backup_bytes: 2147483648
  signings_per_minute: 10
  qes_preparation_minutes: 10
signing:
  ca_validity_years: 10
  ca_renew_before_years: 2
  cert_validity_years: 2
  crl_validity_days: 7
  pin_min: 6
  pin_max: 32
  pin_iterations: 600000
  lock_attempts: 5
  lock_minutes: 15
  audit_job_max_attempts: 10
  audit_job_interval_ms: 2000
verify:
  use_system_roots: true
  extra_roots_file: ''
qes:
  origin_cert_file: ''
  origin_key_file: ''
gateway:
  service: gateway
  issuer: '@@GATEWAY_ISSUER@@'
